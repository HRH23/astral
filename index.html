<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Crush Clone</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1 class="game-title">🍭 Candy Crush Clone</h1>
            <div class="game-stats">
                <div class="stat-item">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Level</span>
                    <span class="stat-value" id="level">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Moves</span>
                    <span class="stat-value" id="moves">30</span>
                </div>
            </div>
        </header>
        
        <main class="game-main">
            <div class="game-board-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="game-board" id="game-board"></div>
                <div class="game-controls">
                    <button class="btn btn-primary" id="new-game-btn">New Game</button>
                    <button class="btn btn-secondary" id="hint-btn">💡 Hint</button>
                    <button class="btn btn-secondary" id="shuffle-btn">🔄 Shuffle</button>
                </div>
            </div>
            
            <div class="side-panel">
                <div class="objectives">
                    <h3>Level Objectives</h3>
                    <div class="objective-item">
                        <span class="candy-icon">🍬</span>
                        <span class="objective-text">Collect 20 Red Candies</span>
                        <span class="objective-progress" id="red-progress">0/20</span>
                    </div>
                    <div class="objective-item">
                        <span class="candy-icon">🍭</span>
                        <span class="objective-text">Collect 15 Blue Candies</span>
                        <span class="objective-progress" id="blue-progress">0/15</span>
                    </div>
                </div>
                
                <div class="power-ups">
                    <h3>Power-ups</h3>
                    <div class="power-up-item" data-powerup="bomb">
                        <span class="power-up-icon">💣</span>
                        <span class="power-up-count" id="bomb-count">3</span>
                    </div>
                    <div class="power-up-item" data-powerup="lightning">
                        <span class="power-up-icon">⚡</span>
                        <span class="power-up-count" id="lightning-count">2</span>
                    </div>
                    <div class="power-up-item" data-powerup="rainbow">
                        <span class="power-up-icon">🌈</span>
                        <span class="power-up-count" id="rainbow-count">1</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div class="modal" id="game-over-modal">
        <div class="modal-content">
            <h2 id="modal-title">Level Complete!</h2>
            <p id="modal-message">Great job! You've completed the level.</p>
            <div class="modal-score">
                <span>Final Score: <strong id="final-score">0</strong></span>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="next-level-btn">Next Level</button>
                <button class="btn btn-secondary" id="replay-btn">Replay</button>
            </div>
        </div>
    </div>
    
    <div class="particle-container" id="particle-container"></div>
    
    <script src="script.js"></script>
</body>
</html>
